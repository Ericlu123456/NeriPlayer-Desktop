# NeriPlayer Desktop — Flatpak 构建清单（原型）
#
# 目标：用固定 runtime 提供 glibc 与 WebKitGTK，解决两件事：
#   1. 产物不再受构建机 glibc 限制（runtime 自带 glibc）；
#   2. WebKitGTK 版本可复现（runtime 自带 libwebkit2gtk-4.1）。
#
# runtime 分支决定 WebKitGTK 版本：GNOME 48 大致是 2.48/2.50，可避开 2.54 合成器回归；
# 升级分支前先跑 `flatpak run --command=sh org.gnome.Platform//49 -c
# 'pkg-config --modversion webkit2gtk-4.1'` 确认实际版本。
#
# 当前是原型：构建期允许联网，依赖 pnpm 现场安装。要提 Flathub 必须改成离线构建
# （生成 node-sources.json / cargo-sources.json 并作为 sources 提交），见
# flatpak/README.md。

app-id: moe.ouom.neriplayer.desktop
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: neri-player-desktop

sdk-extensions:
  # 不要在这里写 //分支：SDK 用通用扩展点 `org.freedesktop.Sdk.Extension`
  # （GNOME 49 里声明的 version = 25.08）来解析子扩展，写上 //25.08 反而会被
  # 当成 id 的一部分，去找 .../rust-stable//25.08/x86_64/49 这种不存在的 ref喵
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

finish-args:
  # 图形：优先 Wayland，保留 X11 回退；需要 GPU 直通喵
  - --share=ipc
  # 沙箱默认不带网络命名空间内的出站权限，实测不加这一条时应用完全连不上网喵
  - --share=network
  - --socket=wayland
  # 直接给 x11 而不是 fallback-x11：剪贴板与拖放在 Wayland 后端下仍有应用间差异，
  # 保留 XWayland 通道更稳喵
  - --socket=x11
  - --device=dri
  # 音频：PipeWire/PulseAudio 兼容通道喵
  - --socket=pulseaudio
  # 本地曲库与下载目录（原型阶段先用 home，正式提审时改成 portal 或具体目录）喵
  - --filesystem=home
  # Tauri 把托盘图标写成临时 PNG（$XDG_RUNTIME_DIR/tray-icon/*.png）并把路径当 IconName
  # 传出去；沙箱里 /run/user/$UID 是私有 tmpfs，宿主看不到，KDE 只能画空图标。
  # 把该目录映射到宿主 XDG_RUNTIME_DIR 下，图标才读得到喵
  - --filesystem=xdg-run/tray-icon
  # 设置/歌单等数据：允许读写宿主原有的数据目录，配合 scripts/flatpak-migrate-data.sh
  # 就能在 Flatpak 与 deb/rpm 之间共用同一份配置喵
  - --filesystem=xdg-data/moe.ouom.neriplayer.desktop:create
  # 系统集成：通知、托盘、媒体会话喵
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.neriplayer
  # 文件选择器等 portal 喵
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  # GNOME runtime 不带 appindicator，而 Tauri 的托盘依赖它；用 Flathub 官方 shared module
  # （子模块 flatpak/shared-modules，路径相对本文件所在目录）喵
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: neriplayer
    buildsystem: simple
    build-options:
      # 原型阶段允许构建期联网：corepack 要拉 pnpm，pnpm 要拉依赖。
      # 提 Flathub 之前必须换成离线构建（node-sources.json + cargo-sources.json），
      # 并把这一行删掉，否则审查会直接拒喵
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/neriplayer/.cargo
        npm_config_cache: /run/build/neriplayer/.npm
        COREPACK_HOME: /run/build/neriplayer/.corepack
    build-commands:
      # corepack 要求目标目录已存在，而构建沙箱里的 /app 是空的喵
      - install -d /app/bin
      # pnpm 版本由 package.json 的 packageManager 钉住，corepack 负责拉取喵
      - corepack enable --install-directory /app/bin
      - corepack prepare --activate
      - pnpm install --frozen-lockfile
      # 走 scripts/run-tauri.mjs 以保留 <gitsha>.<MMddHHmm> 版本格式喵
      - pnpm tauri build --no-bundle
      - install -Dm755 src-tauri/target/release/neri-player-desktop /app/bin/neri-player-desktop
      - install -Dm644 flatpak/moe.ouom.neriplayer.desktop.desktop /app/share/applications/moe.ouom.neriplayer.desktop.desktop
      - install -Dm644 flatpak/moe.ouom.neriplayer.desktop.metainfo.xml /app/share/metainfo/moe.ouom.neriplayer.desktop.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/moe.ouom.neriplayer.desktop.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/moe.ouom.neriplayer.desktop.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/moe.ouom.neriplayer.desktop.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/moe.ouom.neriplayer.desktop.png
    sources:
      - type: dir
        path: ..
        # 构建树只需要源码：排除构建产物与缓存目录，否则 flatpak-builder 会整份复制。
        # .git 和 vendor（AMLL 子模块）要保留：前者给 build.rs 取版本号，
        # 后者是前端构建必需的源码喵
        skip:
          - src-tauri/target
          - node_modules
          - dist
          # 只跳过 flatpak 自己的构建产物：desktop/metainfo 就在 flatpak/ 里，必须带上喵
          - flatpak/build-dir
          - flatpak/.flatpak-builder
          - docs
